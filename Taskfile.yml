version: '3'

vars:
  RELEASE_DIR: release/hkscript_v0.2.0
  RELEASE_ARCHIVE: release/hkscript_v0.2.0.tar.gz
  CONFIG: Release
  ZSVISION: /run/media/ayanami/本地磁盘/softsrc/_ZSVision定位库_X64最新版——20250217更新不分横竖线的角度问题函数——不带AVX的(2)
  ZSVISION_SRC: /tmp/hkscore_build
  ZSVISION_CSPROJ: '{{.ZSVISION_SRC}}/HKSCore.ZSVision.csproj'
  ZSVISION_DLL: '{{.ZSVISION_SRC}}/bin/Release/net8.0-windows/HKSCore.dll'

tasks:
  default:
    cmds:
      - task: build
      - task: release

  build:
    desc: 编译 CLI (Release)
    cmds:
      - dotnet build HKSScript.csproj -c {{.CONFIG}} --no-dependencies

  build-win:
    desc: 编译 Windows 单文件 exe (自包含)
    cmds:
      - cd HksFuncGenerator && dotnet restore -r win-x64 && cd ..
      - dotnet restore -r win-x64
      - dotnet publish HKSScript.csproj -c {{.CONFIG}} -r win-x64 --self-contained true -p:PublishSingleFile=true -o /tmp/hks_win

  build-linux:
    desc: 编译 Linux 单文件
    cmds:
      - cd HksFuncGenerator && dotnet restore -r linux-x64 && cd ..
      - dotnet restore -r linux-x64
      - dotnet publish HKSScript.csproj -c {{.CONFIG}} -r linux-x64 --no-self-contained -p:PublishSingleFile=true -o /tmp/hks_linux

  build-nuget:
    desc: 编译 NuGet 包
    cmds:
      - dotnet build HksScript.Sdk/HksScript.Sdk.csproj -c {{.CONFIG}}
      - dotnet pack HksScript.Sdk/HksScript.Sdk.csproj -c {{.CONFIG}} -o ./

  build-vsix:
    desc: 编译 VS Code 插件
    dir: Frontend/vscode-hksscript
    cmds:
      - npx vsce package

  release:
    desc: 打包完整 release
    deps: [build, build-win, build-linux, build-nuget, build-vsix]
    cmds:
      - mkdir -p {{.RELEASE_DIR}}
      - "cp /tmp/hks_linux/HKSScript {{.RELEASE_DIR}}/ 2>/dev/null || true"
      - "cp /tmp/hks_win/HKSScript.exe {{.RELEASE_DIR}}/ 2>/dev/null || true"
      - cp bin/{{.CONFIG}}/net10.0/HKSScript.dll {{.RELEASE_DIR}}/
      - cp bin/{{.CONFIG}}/net10.0/HKSScript.runtimeconfig.json {{.RELEASE_DIR}}/
      - "cp bin/{{.CONFIG}}/net10.0/HksScript.Sdk.dll {{.RELEASE_DIR}}/"
      - "cp HksScript.Sdk.*.nupkg {{.RELEASE_DIR}}/ 2>/dev/null || true"
      - "cp Frontend/vscode-hksscript/hksscript-*.vsix {{.RELEASE_DIR}}/ 2>/dev/null || true"
      - "cp run_csharp.sh {{.RELEASE_DIR}}/ 2>/dev/null || true"
      - "echo hks.cmd > {{.RELEASE_DIR}}/hks.cmd"
      - tar czf {{.RELEASE_ARCHIVE}} -C release hkscript_v0.2.0/
      - "echo release: {{.RELEASE_ARCHIVE}}"

  wine-setup:
    desc: 安装 Windows 版 HKSScript 到 Wine 固定目录
    deps: [build-win]
    cmds:
      - "mkdir -p {{.HOME}}/.hks"
      - "cp /tmp/hks_win/HKSScript.exe {{.HOME}}/.hks/"
      - "cp bin/{{.CONFIG}}/net10.0/HksScript.Sdk.dll {{.HOME}}/.hks/ 2>/dev/null || true"
      - "ln -sf {{.HOME}}/.hks/HKSScript.exe {{.HOME}}/.hks/hks.exe 2>/dev/null || true"
      - "echo Wine HKSScript: {{.HOME}}/.hks/HKSScript.exe"

  wine-run:
    desc: 在 wine 中运行脚本 (需先 wine-setup)
    cmds:
      - "WINEDEBUG=-all wine {{.HOME}}/.hks/HKSScript.exe run '{{.FILE}}'"

  wine-build:
    desc: 在 Linux 上编译 Windows .csproj (native dotnet)
    cmds:
      - "dotnet build '{{.CSPROJ}}' -c Release -p:EnableWindowsTargeting=true 2>&1 | tail -5"

  wine-install:
    desc: 在 wine 中 install DLL
    cmds:
      - "WINEDEBUG=-all wine {{.HOME}}/.hks/HKSScript.exe install global '{{.DLL}}'"

  wine-deploy:
    desc: 编译 + install + 复制原生 DLL (一站完成)
    deps: [wine-build]
    cmds:
      - task: wine-install
      - "cp $(dirname '{{.DLL}}')/*.dll {{.HOME}}/.hks/lib/ 2>/dev/null || true"
      - "echo === 部署完成: wine-run FILE=脚本.hks ==="

  deploy-zsvision:
    desc: 编译 + install ZSVision 算法库
    cmds:
      - "cp -rf '{{.ZSVISION}}/.' '{{.ZSVISION_SRC}}/' && rm -rf '{{.ZSVISION_SRC}}/bin' '{{.ZSVISION_SRC}}/obj' '{{.ZSVISION_SRC}}/nuget.config' 2>/dev/null; true"
      - task: wine-build
        vars: {CSPROJ: '{{.ZSVISION_CSPROJ}}'}
      - task: wine-install
        vars: {DLL: '{{.ZSVISION_DLL}}'}
      - "cp '{{.ZSVISION}}/bin/Release/net8.0-windows/'*.dll {{.HOME}}/.hks/lib/ 2>/dev/null || true"
      - "echo === ZSVision 部署完成 ==="

  wine-build-install:
    desc: 编译 + install Windows 项目
    cmds:
      - task: wine-build
      - task: wine-install
        vars:
          DLL: "{{.DLL}}"

  wine-list:
    desc: 在 wine 中列出已注册函数
    cmds:
      - "WINEDEBUG=-all wine {{.HOME}}/.hks/HKSScript.exe list"

  clean:
    desc: 清空产物
    cmds:
      - "rm -rf obj bin release/{{.RELEASE_DIR}} Frontend/vscode-hksscript/*.vsix"

  list:
    desc: 列出已注册函数
    cmds:
      - "./bin/{{.CONFIG}}/net10.0/HKSScript list"

  install:
    desc: 安装模块
    cmds:
      - "./bin/{{.CONFIG}}/net10.0/HKSScript install global '{{.DLL}}'"

  run:
    desc: 运行脚本
    cmds:
      - "./bin/{{.CONFIG}}/net10.0/HKSScript run '{{.FILE}}'"
